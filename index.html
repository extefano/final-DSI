      content="Plataforma interactiva gamificada para estudiar Diseño de Sistemas de Información con ejercicios cloze, rompecabezas de diagramas UML y arquitectura, repaso espaciado y sincronización sin servidor."

    <meta property="og:title" content="Estudio DSI — Práctica Interactiva de Diseño de Sistemas" />

    />

      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Outfit:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('estudio_dsi_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-[#0B1120] dark:text-slate-100 antialiased selection:bg-emerald-500/20 selection:text-emerald-900 dark:selection:text-emerald-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
